; Emberfall - configuration moteur minimale.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.CollisionProfile]
; Canal de trace de mêlée : ignoré par défaut. À régler à la main sur les assets :
; Physics Assets et pawns en Overlap, décor en Block, capsules de collision en Ignore.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="EMBMeleeHit")
; Canal de placement des pièces de construction (type objet) : bloqué par défaut.
; Les volumes Building.NoBuildZone le règlent en Overlap.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="EMBBuilding")
; Canal objet des projectiles de boss (v1.3). Réponse par défaut Block : les autres objets (pawns, décor)
; « acceptent » ainsi le projectile, et c'est le projectile qui décide (réponse effective = la plus faible
; des deux) : Block sur WorldStatic, Overlap sur Pawn, Ignore sur WorldDynamic et sur ce canal.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="EMBProjectile")

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Emberfall.EMBGameMode

[/Script/Engine.Engine]
; Gestionnaire de significance (bestiaire) : classe de base du plugin SignificanceManager, ou une classe dérivée
; du projet. Clé issue de « Project Settings > Engine > General Settings > Default Classes > Significance Manager
; Class » (UEngine::SignificanceManagerClassName). Ce nom de clé est donné de mémoire et n'a pas pu être vérifié
; ici (pas d'Unreal installé) : à contrôler à la première ouverture de l'éditeur. Une clé inconnue est simplement
; ignorée, et le bestiaire prévoit un repli si le gestionnaire est absent.
SignificanceManagerClassName=/Script/SignificanceManager.SignificanceManager
