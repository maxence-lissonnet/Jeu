; Emberfall - configuration moteur minimale.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.CollisionProfile]
; Canal de trace de mêlée : ignoré par défaut. À régler à la main sur les assets :
; Physics Assets et pawns en Overlap, décor en Block, capsules de collision en Ignore.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="EMBMeleeHit")
; Canal de placement des pièces de construction (type objet) : bloqué par défaut.
; Les volumes Building.NoBuildZone le règlent en Overlap.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="EMBBuilding")

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Emberfall.EMBGameMode
