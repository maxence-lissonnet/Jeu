[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Emberfall

[/Script/Emberfall.EMBProgressionSettings]
GlyphTable=/Game/Data/DT_Glyphs.DT_Glyphs
SkillTable=/Game/Data/DT_SkillNodes.DT_SkillNodes
; RevealOnly : le déclencheur révèle le glyphe secret (à acheter). AutoUnlock : débloqué gratuitement.
SecretGlyphMode=RevealOnly
; RespawnAtSafePoint : joueur mort sauvegardé PV pleins au dernier point sûr. KeepPosition : position telle quelle.
DeathSaveBehavior=RespawnAtSafePoint
XPBase=150.0
XPExponent=1.5
MaxLevel=80
GlyphPointsLevels2To20=4
GlyphPointsLevels21To50=6
GlyphPointsLevels51To80=8
AwakeningPointsPerLevel=1
AwakeningPointsPerBoss=1
GuardianXP=6000
SeraphXP=15000
DragonXP=60000
ParticipantRadius=10000.0

[/Script/UnrealEd.ProjectPackagingSettings]
; Les DataTables sont chargées par chemin (soft) : sans cette ligne elles ne seraient pas incluses dans le build.
+DirectoriesToAlwaysCook=(Path="/Game/Data")

[/Script/Emberfall.EMBSaveSubsystem]
; Doit pointer vers la même DataTable que le composant de construction (sinon les écritures sont bloquées si des pièces existent).
BuildPiecesTable=/Game/Data/DT_BuildPieces.DT_BuildPieces
